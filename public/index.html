     Only set it if the page is hosted somewhere else, e.g. <meta name="hush-server" content="https://your-app.up.railway.app"> -->

<style>
/* ============================== THEME ============================== */
:root{
  --accent:#00f782; --accent-soft:rgba(0,247,130,.14); --on-accent:#08130d;
  --danger:#ff453a; --warn:#ffb020; --ok:#31d158;
}
[data-theme="dark"]{
  --bg:#141414; --rail:#101010; --panel:#1b1b1b; --panel-2:#242424; --line:#2c2c2c;
  --text:#f3f3f3; --dim:#a4a4a4; --faint:#6e6e6e;
  --bubble-in:#2d2d2d; --bubble-out:#00f782; --text-out:#08130d;
  --hover:rgba(255,255,255,.06); --overlay:rgba(0,0,0,.62); --field:#262626;
}
[data-theme="light"]{
  --bg:#ffffff; --rail:#f1f1f1; --panel:#f8f8f8; --panel-2:#ffffff; --line:#e4e4e4;
  --text:#121212; --dim:#5f5f5f; --faint:#9a9a9a;
  --bubble-in:#ececec; --bubble-out:#00f782; --text-out:#08130d;
  --hover:rgba(0,0,0,.05); --overlay:rgba(0,0,0,.4); --field:#ededed;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{
  font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Public Sans",Helvetica,Arial,sans-serif;
  background:var(--bg);color:var(--text);overflow:hidden;overscroll-behavior:none;-webkit-font-smoothing:antialiased;
}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
input,textarea{font:inherit;color:inherit}
[hidden]{display:none!important}
.dim{color:var(--dim)} .faint{color:var(--faint)}
svg{display:block;flex:none}
/* keyboard focus is always visible; mouse/touch focus stays quiet */
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.inp:focus-visible,.search input:focus-visible,.composer textarea:focus-visible{outline:none}
a.iconbtn,a.srow,a.btn{text-decoration:none}
a.srow{color:inherit}

/* ============================== APP SHELL ============================== */
#app{position:fixed;left:0;top:0;width:100%;height:var(--app-h,100dvh);display:grid;grid-template-columns:76px 350px minmax(0,1fr);background:var(--bg)}
.rail{background:var(--rail);border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;padding:14px 0;gap:8px}
.rail .spacer{flex:1}
.rbtn{position:relative;width:48px;height:48px;border-radius:14px;display:grid;place-items:center;color:var(--dim);transition:background .15s,color .15s}
.rbtn:hover{background:var(--hover);color:var(--text)}
.rbtn.on{color:var(--on-accent);background:var(--accent)}
.badge{position:absolute;top:1px;right:-1px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--danger);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center;border:2px solid var(--rail)}
.rail-avatar{margin-bottom:10px}

.panel{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;min-width:0}
.phead{padding:18px 16px 8px 20px;display:flex;align-items:center;gap:10px}
.phead h1{margin:0;font-size:24px;font-weight:800;letter-spacing:-.02em}
.netline{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--faint);margin-top:2px}
.netline i{width:7px;height:7px;border-radius:50%;background:var(--faint)}
.netline.ok i{background:var(--ok)} .netline.wait i{background:var(--warn)} .netline.bad i{background:var(--danger)}
.iconbtn{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;color:var(--dim);transition:.15s}
.iconbtn:hover{background:var(--hover);color:var(--text)}
.iconbtn.accent{background:var(--accent);color:var(--on-accent)}
.search{margin:6px 14px 8px;display:flex;align-items:center;gap:8px;background:var(--field);border-radius:12px;padding:0 12px;color:var(--faint)}
.search input{flex:1;min-width:0;border:0;background:none;outline:none;padding:11px 0;color:var(--text)}
.plist{flex:1;overflow-y:auto;padding:4px 8px 16px;min-height:0}
.item{display:flex;gap:12px;align-items:center;width:100%;text-align:left;padding:10px;border-radius:14px;transition:background .12s}
.item:hover{background:var(--hover)} .item.on{background:var(--accent-soft)}
.imain{flex:1;min-width:0}
.irow{display:flex;align-items:center;gap:8px}
.iname{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:650}
.itime{font-size:12px;color:var(--faint);flex:none}
.iprev{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13.5px;color:var(--dim)}
.ubadge{min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:var(--accent);color:var(--on-accent);font-size:12px;font-weight:800;display:grid;place-items:center}
.tag{font-size:10.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:2px 7px;border-radius:6px;background:var(--accent-soft);color:var(--accent)}
[data-theme="light"] .tag{color:#008a49}
.sect{padding:14px 12px 6px;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--faint)}
.emptybox{padding:48px 24px;text-align:center;color:var(--dim)}
.emptybox .big{width:72px;height:72px;border-radius:24px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;margin:0 auto 16px}
.emptybox h3{margin:0 0 6px;color:var(--text)}

/* avatar */
.avatar{position:relative;width:var(--s,44px);height:var(--s,44px);flex:none;border-radius:50%;
  background:linear-gradient(135deg,hsl(var(--h) 62% 50%),hsl(var(--h2) 58% 34%));color:#fff;display:grid;place-items:center;
  font-weight:700;font-size:calc(var(--s,44px)*.42);user-select:none}
.avatar .dot{position:absolute;right:-1px;bottom:-1px;width:28%;height:28%;min-width:10px;min-height:10px;border-radius:50%;background:var(--ok);border:2.5px solid var(--panel)}

/* buttons */
.btn{border-radius:12px;padding:12px 16px;font-weight:650;background:var(--field);color:var(--text);transition:filter .15s,transform .1s}
.btn:hover{filter:brightness(1.1)} .btn:active{transform:scale(.98)}
.btn.primary{background:var(--accent);color:var(--on-accent)}
.btn.danger{background:var(--danger);color:#fff}
.btn.ghost{background:transparent;border:1px solid var(--line)}
.btn.block{width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btnrow{display:flex;gap:10px;margin-top:16px}.btnrow .btn{flex:1}

/* ============================== CHAT PANE ============================== */
.chatpane{display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--bg);position:relative}
.empty{margin:auto;text-align:center;padding:24px;max-width:360px}
.logo{width:84px;height:84px;border-radius:26px;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;margin:0 auto 18px;box-shadow:0 18px 50px -14px rgba(0,247,130,.55)}
.empty h2{margin:0 0 6px;font-size:26px;font-weight:800;letter-spacing:-.02em}
.lockline{display:inline-flex;gap:6px;align-items:center;font-size:12.5px;color:var(--dim);margin-top:14px;padding:6px 12px;border-radius:999px;background:var(--field)}
.chat{display:flex;flex-direction:column;min-height:0;height:100%}
.chead{display:flex;align-items:center;gap:6px;padding:10px 10px 10px 8px;padding-top:calc(10px + env(safe-area-inset-top));background:var(--panel);border-bottom:1px solid var(--line)}
.back{display:none}
.chead .who{flex:1;min-width:0;display:flex;align-items:center;gap:12px;text-align:left;padding:2px 6px;border-radius:12px}
.chead .who:hover{background:var(--hover)}
.chead .nm{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chead .st{font-size:12.5px;color:var(--faint);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chead .st.on{color:var(--ok)}
.banner{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:12px 14px;background:var(--accent-soft);border-bottom:1px solid var(--line);font-size:14px}
.banner .btnrow{margin:0;flex:none}
.banner .btn{padding:8px 14px}
.msgs{flex:1;overflow-y:auto;padding:14px 14px 8px;display:flex;flex-direction:column;gap:3px;min-height:0;scroll-behavior:smooth}
.day{align-self:center;margin:12px 0 6px;font-size:12px;font-weight:600;color:var(--dim);background:var(--field);padding:4px 12px;border-radius:999px}
.hint{margin:auto;text-align:center;color:var(--dim);max-width:280px;padding:24px}
.hint .lockline{margin-top:10px}
.row{display:flex;flex-direction:column}
.row.out{align-items:flex-end}.row.in{align-items:flex-start}
.bubble{position:relative;max-width:min(78%,540px);padding:8px 12px 6px;border-radius:19px;background:var(--bubble-in);word-break:break-word;overflow-wrap:anywhere;white-space:pre-wrap;user-select:text;-webkit-user-select:text}
.row.out .bubble{background:var(--bubble-out);color:var(--text-out);border-bottom-right-radius:6px}
.row.in .bubble{border-bottom-left-radius:6px}
.bubble a{color:inherit;text-decoration:underline}
.bubble.media{padding:3px;overflow:hidden}
.bubble.media .bmeta{position:absolute;right:10px;bottom:8px;margin:0;padding:2px 8px;border-radius:10px;background:rgba(0,0,0,.5);color:#fff;opacity:1}
.bubble.deleted{background:transparent!important;border:1px dashed var(--line);color:var(--faint);font-style:italic}
.bmeta{display:flex;justify-content:flex-end;align-items:center;gap:4px;font-size:11px;margin-top:1px;white-space:normal}
.bubble img.pic{display:block;width:min(320px,68vw);max-height:400px;object-fit:cover;border-radius:16px;cursor:zoom-in;background:var(--field)}
.voice{display:flex;align-items:center;gap:10px;min-width:min(230px,60vw);padding:2px 2px 0}
.vplay{width:38px;height:38px;border-radius:50%;background:rgba(0,0,0,.18);display:grid;place-items:center;flex:none}
.row.in .vplay{background:var(--accent);color:var(--on-accent)}
.vbar{flex:1;height:5px;border-radius:3px;background:rgba(127,127,127,.35);position:relative;cursor:pointer}
.vbar i{position:absolute;left:0;top:0;bottom:0;width:0;border-radius:3px;background:currentColor}
.vtime{font-size:12px;font-variant-numeric:tabular-nums;min-width:34px;text-align:right}
.sys{align-self:center;display:flex;gap:6px;align-items:center;font-size:12.5px;color:var(--dim);background:var(--field);padding:5px 12px;border-radius:999px;margin:6px 0}
.sys.miss{color:var(--danger)}

.composer{display:flex;align-items:flex-end;gap:6px;padding:8px 10px calc(8px + env(safe-area-inset-bottom));background:var(--panel);border-top:1px solid var(--line)}
.composer .field{flex:1;min-width:0;background:var(--field);border-radius:22px;display:flex;align-items:flex-end}
.composer textarea{flex:1;border:0;background:none;outline:none;resize:none;padding:11px 16px;max-height:132px;line-height:1.35;color:var(--text)}
.composer textarea::placeholder{color:var(--faint)}
.sendbtn{width:46px;height:46px;border-radius:50%;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;flex:none;transition:transform .1s}
.sendbtn:active{transform:scale(.94)}
.recbar{flex:1;display:flex;align-items:center;gap:12px;background:var(--field);border-radius:22px;padding:0 6px 0 16px;height:46px}
.recbar .rd{width:10px;height:10px;border-radius:50%;background:var(--danger);animation:pulse 1s infinite}
.recbar .rt{font-variant-numeric:tabular-nums;font-weight:650}
.recbar .rl{flex:1;color:var(--faint);font-size:13px}
@keyframes pulse{50%{opacity:.25}}
.composer.recording .field,.composer.recording #btnImg,.composer.recording #btnMic{display:none}
.composer:not(.recording) .recbar{display:none}
.dropmask{position:absolute;inset:0;background:var(--accent-soft);border:2px dashed var(--accent);display:grid;place-items:center;font-weight:700;z-index:5;pointer-events:none}

/* ============================== MODALS ============================== */
.overlay{position:fixed;inset:0;z-index:150;background:var(--overlay);display:grid;place-items:center;padding:16px;animation:fade .15s}
.sheet{background:var(--panel-2);border:1px solid var(--line);border-radius:22px;width:min(460px,100%);max-height:88dvh;overflow:auto;padding:22px;animation:pop .18s ease}
.sheet h3{margin:0 0 4px;font-size:19px}
.sheet p{margin:6px 0}
.sheet label{display:block;font-size:12.5px;font-weight:650;color:var(--dim);margin:14px 0 6px}
.inp{width:100%;background:var(--field);border:1.5px solid transparent;border-radius:12px;padding:12px 14px;outline:none;color:var(--text)}
.inp:focus{border-color:var(--accent)}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12.5px;word-break:break-all;line-height:1.5}
.idbox{background:var(--field);border-radius:12px;padding:12px 14px}
.menu{display:flex;flex-direction:column;margin:-6px -8px}
.menu button{display:flex;align-items:center;gap:14px;padding:13px 12px;border-radius:12px;text-align:left;font-weight:550}
.menu button:hover{background:var(--hover)}
.menu button.danger{color:var(--danger)}
.snum{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:8px}
.snum span{background:var(--field);border-radius:8px;padding:8px 0;text-align:center;font-family:ui-monospace,Menlo,monospace;font-size:13px}
.center{text-align:center}
@keyframes fade{from{opacity:0}} @keyframes pop{from{opacity:0;transform:translateY(10px) scale(.98)}}
@media (max-width:820px){
  .overlay{place-items:end center;padding:0}
  .sheet{width:100%;border-radius:24px 24px 0 0;border-bottom:0;padding-bottom:calc(22px + env(safe-area-inset-bottom));animation:slideup .22s ease}
  @keyframes slideup{from{transform:translateY(40px);opacity:0}}
}

.viewer{position:fixed;inset:0;z-index:170;background:rgba(0,0,0,.94);display:flex;align-items:center;justify-content:center}
.viewer img{max-width:100%;max-height:100%;object-fit:contain}
.viewer .vt{position:absolute;top:calc(12px + env(safe-area-inset-top));right:12px;display:flex;gap:8px}
.viewer .vt button{width:46px;height:46px;border-radius:50%;background:rgba(255,255,255,.14);color:#fff;display:grid;place-items:center}

#toasts{position:fixed;left:50%;transform:translateX(-50%);top:calc(14px + env(safe-area-inset-top));z-index:400;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:min(92vw,420px)}
.toast{background:var(--panel-2);color:var(--text);border:1px solid var(--line);padding:11px 16px;border-radius:14px;box-shadow:0 12px 32px rgba(0,0,0,.4);font-size:14px;animation:tin .2s ease;text-align:center}
.toast.error{border-color:var(--danger)} .toast.ok{border-color:var(--accent)}
.toast.out{opacity:0;transform:translateY(-8px);transition:.3s}
@keyframes tin{from{opacity:0;transform:translateY(-10px)}}

/* ============================== WELCOME ============================== */
.welcome{position:fixed;inset:0;z-index:100;background:radial-gradient(120% 80% at 50% 0%,rgba(0,247,130,.12),transparent 60%),var(--bg);display:flex;align-items:center;justify-content:center;padding:24px;overflow:auto}
.wcard{width:min(420px,100%);text-align:center}
.wcard h1{font-size:34px;letter-spacing:-.03em;margin:8px 0 6px}
.wcard .tagline{color:var(--dim);margin:0 0 28px}
.wcard .btn{margin-top:10px}
.feat{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:26px}
.feat span{font-size:12.5px;color:var(--dim);background:var(--field);padding:6px 12px;border-radius:999px;display:inline-flex;gap:6px;align-items:center}
.secbox{margin-top:20px;display:grid;grid-template-columns:1fr 1fr;gap:8px;text-align:left}
.secrow{display:flex;gap:8px;align-items:center;padding:9px 10px;border-radius:12px;background:var(--accent-soft);border:1px solid var(--accent);min-width:0}
.secrow .si{flex:none;width:28px;height:28px;border-radius:9px;background:var(--accent);color:var(--on-accent);display:grid;place-items:center}
.secrow b{display:block;font-size:12px;line-height:1.25;font-weight:650}
.secrow.warn{background:rgba(255,90,90,.10);border-color:rgba(255,90,90,.55)}
.secrow.warn .si{background:#ff5a5a;color:#fff}
.wcard .idbox{text-align:left;margin:14px 0}

/* settings */
.card{background:var(--panel-2);border:1px solid var(--line);border-radius:16px;padding:6px;margin:6px 6px 14px}
.srow{display:flex;align-items:center;gap:12px;padding:12px;border-radius:12px;width:100%;text-align:left}
button.srow:hover,a.srow:hover{background:var(--hover)}
.srow .grow{flex:1;min-width:0}
.srow small{display:block;color:var(--dim);font-size:12.5px}
.srow.danger{color:var(--danger)}
.srow.apk{color:var(--accent)}
[data-theme="light"] .srow.apk{color:#008a49}
.switch{width:46px;height:28px;border-radius:14px;background:var(--line);position:relative;transition:.2s;flex:none}
.switch::after{content:"";position:absolute;left:3px;top:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:.2s}
.switch.on{background:var(--accent)} .switch.on::after{left:21px}

/* ============================== ANDROID APP PROMO ==============================
   Shown ONLY in an Android browser. Never inside the Hushchats Android app / WebView. */
.iconbtn.apk{position:relative;color:var(--accent);background:var(--accent-soft)}
[data-theme="light"] .iconbtn.apk{color:#008a49}
.iconbtn.apk::after{content:"";position:absolute;top:7px;right:7px;width:8px;height:8px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 2px var(--panel);animation:pulse 1.6s infinite}
.apkcard{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--accent-soft);border:1px solid var(--accent);border-radius:16px;padding:12px 14px;margin-top:22px;color:var(--text)}
.apkcard .ai{width:42px;height:42px;border-radius:12px;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;flex:none}
.apkcard .at{flex:1;min-width:0}
.apkcard b{display:block}
.apkcard small{color:var(--dim)}
.promo{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:320;width:min(360px,calc(100vw - 28px));background:var(--panel-2);color:var(--text);
  border:1px solid var(--accent);border-radius:22px;padding:22px 20px 18px;text-align:center;
  box-shadow:0 24px 70px rgba(0,0,0,.55),0 0 0 6px var(--accent-soft);animation:promoIn .22s ease}

/* Native append()/prepend()/replaceChildren() turn null into the text "null" — that was the “nullnullnull” in the call bar.

['append', 'prepend', 'replaceChildren'].forEach(fn => {

/* ============================== IndexedDB ============================== */
const DB = (() => {
  let db;
  const open = () => new Promise((res, rej) => {
    const r = indexedDB.open('hushline', 2);
    r.onupgradeneeded = ev => {
      const d = r.result, old = ev.oldVersion;
      if (old < 1) {
        d.createObjectStore('friends', { keyPath: 'id' });
        const m = d.createObjectStore('messages', { keyPath: 'id' });
        m.createIndex('peer_ts', ['peer', 'ts']); m.createIndex('peer', 'peer');
      }
      if (old < 2) { const m = r.transaction.objectStore('messages'); if (!m.indexNames.contains('status')) m.createIndex('status', 'status'); }
    };
    r.onsuccess = () => { db = r.result; res(); };
    r.onerror = () => rej(r.error);
  });
  const tx = (store, mode, fn) => new Promise((res, rej) => {
    const t = db.transaction(store, mode); const s = t.objectStore(store); let out;
    const rq = fn(s); if (rq) rq.onsuccess = () => { out = rq.result; };
    t.oncomplete = () => res(out); t.onerror = () => rej(t.error); t.onabort = () => rej(t.error);
  });
  return {
    open,
    get: (s, k) => tx(s, 'readonly', o => o.get(k)),
    put: (s, v) => tx(s, 'readwrite', o => o.put(v)),
    del: (s, k) => tx(s, 'readwrite', o => o.delete(k)),
    all: s => tx(s, 'readonly', o => o.getAll()),
    pending: () => tx('messages', 'readonly', o => o.index('status').getAll('pending')),
    msgs: peer => tx('messages', 'readonly', o => o.index('peer_ts').getAll(IDBKeyRange.bound([peer, 0], [peer, Infinity]))),
    delPeer: peer => new Promise((res, rej) => {
      const t = db.transaction('messages', 'readwrite'); const idx = t.objectStore('messages').index('peer');
      const rq = idx.openKeyCursor(IDBKeyRange.only(peer));
      rq.onsuccess = () => { const c = rq.result; if (c) { t.objectStore('messages').delete(c.primaryKey); c.continue(); } };
      t.oncomplete = () => res(); t.onerror = () => rej(t.error); t.onabort = () => rej(t.error);
    }),
    wipe: () => new Promise(res => { try { db.close(); } catch {} const r = indexedDB.deleteDatabase('hushline'); r.onsuccess = r.onerror = r.onblocked = () => res(); })
  };
})();

async function applyNewId(v) {
  if (!L.authed) throw new Error('offline');
  /* Tell friends BEFORE switching handles on the server. If we rename first, the server already
     authenticates this socket as the new id by the time these notices go out — so the envelope's
     "from" is already the new id, hd.id also equals the new id, onContactRename's own "nid === from"
     no-op guard matches by accident, and every friend silently keeps our OLD id forever (working only
     until the 30-day alias forward expires, then breaking with no warning). Sending while still
     authenticated as the old id keeps "from" == old id, so the update actually lands. */
  const friends = [...S.friends.values()].filter(f => f.status === 'friend');
  await Promise.all(friends.map((f, i) => new Promise(res => setTimeout(res, i * 80)).then(() => sendQueued(f.id, { k: 'rename', id: v }, 'ctl').catch(() => {}))));
  const r = await linkReq('rename', { id: v });
  if (!r.ok) throw new Error(r.err || 'rename');
  S.me.id = v; storeIdentity();
  refreshList(); refreshRail(); if (S.tab === 'settings') buildPanel();
}

async function moveFriend(old, nid) {   // a contact changed their ID: keep the chat, switch the address
  const fr = S.friends.get(old); if (!fr || S.friends.has(nid) || nid === S.me.id) return false;
  const ms = await DB.msgs(old);
  await DB.del('friends', old);
  fr.id = nid; await DB.put('friends', fr);
  for (const m of ms) { m.peer = nid; await DB.put('messages', m); }
  S.friends.delete(old); S.friends.set(nid, fr);
  S.badKey.delete(old); S.warned.delete(old); S.typing.delete(old); S.presence.delete(old);
  if (S.active === old) { S.active = nid; S.msgs.forEach(m => { if (m.peer === old) m.peer = nid; }); }
  refreshList(); refreshRail(); if (S.active === nid) refreshChatHeader();
  toast(dispName(fr) + ' changed their ID to ' + nid, 'ok');
  watchFriends().catch(() => {});
  return true;
}

/* ---------- photo / voice transfer (encrypted, with progress like WhatsApp) ---------- */
function uploadMedia(m) {
  return new Promise(async resolve => {
    const st = { state: 'up', prog: 0, xhr: null }; XF.set(m.id, st); paintMedia(m);
    let enc; try { enc = await encryptMedia(m.blob); } catch { st.state = 'fail'; paintMedia(m); return resolve(false); }
    if (st.cancelled) return resolve(false);
    const xhr = new XMLHttpRequest(); st.xhr = xhr;
    xhr.open('POST', SERVER_URL + '/api/media'); xhr.setRequestHeader('x-token', L.token); xhr.timeout = 180000;
    xhr.upload.onprogress = ev => { if (ev.lengthComputable) { st.prog = ev.loaded / ev.total; paintMedia(m, true); } };
    const fail = () => { if (st.cancelled) return resolve(false); st.state = 'fail'; paintMedia(m); resolve(false); };
    xhr.onerror = fail; xhr.ontimeout = fail; xhr.onabort = () => resolve(false);

      if (xhr.status !== 200) { if (xhr.status === 401) startLink(); return fail(); }
      try {

        m.media = { id: j.id, key: enc.key, size: enc.data.length };

}
async function startDownload(m) {
  if (m.blob || !m.media || XF.has(m.id)) return;
  const st = { state: 'down', prog: 0, ctl: new AbortController() }; XF.set(m.id, st); paintMedia(m);
  try {
    const res = await fetch(SERVER_URL + '/api/media/' + m.media.id, { signal: st.ctl.signal });
    if (res.status === 404) { st.state = 'gone'; paintMedia(m); return; }
    if (!res.ok) throw new Error('http ' + res.status);
    const total = +res.headers.get('content-length') || m.media.size || 0;
    if (total > MAX_MEDIA_BYTES + 64) throw new Error('too big');
    const chunks = []; let got = 0;
    if (res.body && res.body.getReader) {
      const rd = res.body.getReader();
      for (;;) { const { done, value } = await rd.read(); if (done) break; chunks.push(value); got += value.length; if (got > MAX_MEDIA_BYTES + 64) throw new Error('too big'); st.prog = total ? got / total : 0; paintMedia(m, true); }
    } else { const b = new Uint8Array(await res.arrayBuffer()); chunks.push(b); got = b.length; }
    const buf = new Uint8Array(got); let o = 0; for (const c of chunks) { buf.set(c, o); o += c.length; }
    const plain = await decryptMedia(buf, m.media.key);
    m.blob = new Blob([plain], { type: m.mime });
    const live = S.msgs.find(x => x.id === m.id); if (live && live !== m) live.blob = m.blob;
    await DB.put('messages', m); XF.delete(m.id); paintMedia(m);
  } catch (e) {

  }
}

/* --- images --- */
async function prepareImage(file) {

  catch { src = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = URL.createObjectURL(file); }); w = src.naturalWidth; h_ = src.naturalHeight; }

    const sc = Math.min(1, maxDim / Math.max(w, h_)); const cw = Math.max(1, Math.round(w * sc)), ch = Math.max(1, Math.round(h_ * sc));
    const c = document.createElement('canvas'); c.width = cw; c.height = ch; const ctx = c.getContext('2d');
    if (mime === 'image/jpeg') { ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, cw, ch); }

}

}

/* ---------- directory: who is this ID, what is their key ---------- */
const lookupCache = new Map();

  const r = await linkReq('lookup', { id });

     link or saved ID made before someone renamed still finds them instead of coming back "nobody has that ID" */
  const v = { exists: !!r.exists, pub: r.pub || '', name: r.name || '', id: r.id || id, at: Date.now() };
  if (v.exists) lookupCache.set(id, v); else lookupCache.delete(id);

}

    if (!fr.pub && fr.fp && (await fpOf(unb64u(u.pub))) !== fr.fp) { keyMismatch(fr); throw new Error('badkey'); }

  }

    dots, err, pad,

}
function showLock() {

/* ---------- panic wipe: instantly destroys everything on THIS device (identity, chats, photos). Cannot be undone. ---------- */
async function wipeNow() {
  try { L.stop = true; L.ws && L.ws.close(); } catch {}
  try { indexedDB.deleteDatabase('hushline'); } catch {}
  try { localStorage.clear(); sessionStorage.clear(); } catch {}
  try { if ('caches' in window) { const ks = await caches.keys(); await Promise.all(ks.map(k => caches.delete(k))); } } catch {}
  try { if ('serviceWorker' in navigator) { const rs = await navigator.serviceWorker.getRegistrations(); await Promise.all(rs.map(r => r.unregister())); } } catch {}
  location.replace(location.pathname);
}
function wipeConfirm() {
  openSheet((sh, close) => {
    sh.append(h('h3', { style: 'color:var(--danger)' }, '⚠ Erase this device'),
      h('p', { class: 'dim' }, 'Deletes your identity, every chat and every photo stored on THIS device, right now. There is no undo, and no server involved — it cannot be stopped once started.'),
      h('div', { class: 'btnrow' }, h('button', { class: 'btn ghost', onclick: close }, 'Cancel'), h('button', { class: 'btn primary', style: 'background:var(--danger)', onclick: wipeNow }, 'Erase now')));
  });
}
/* fast physical panic trigger: tap the app name 5 times quickly */
function armPanicTap(el) {
  let n = 0, t = 0;
  el.addEventListener('click', () => { const now = Date.now(); if (now - t > 600) n = 0; t = now; n++; if (n >= 5) { n = 0; wipeConfirm(); } });
}

/* ============================== onboarding ============================== */
async function currentKeyRecord() {

  return JSON.parse(localStorage.getItem('hl.key') || '{}');
}
async function storeIdentity() { const k = await currentKeyRecord().catch(() => ({})); k.name = S.me.name; k.handle = S.me.id; await persistIdentity(k); }
function showWelcome() {
  $('#app').hidden = true; const w = $('#welcome'); w.hidden = false; w.replaceChildren(h('div', { class: 'wcard' },
    (() => { const lg = h('div', { class: 'logo' }, icon('logo', 46)); armPanicTap(lg); return lg; })(), h('h1', {}, APP_NAME), h('p', { class: 'tagline' }, 'Private chats and calls. No phone number. No email. No tracking.'),
    h('button', { class: 'btn primary block', onclick: createAccountStep }, 'Create account'),
    h('button', { class: 'btn block', onclick: restoreStep }, 'Existing account from recovery key'),

    h('div', { class: 'secbox' },

}
async function createAccountStep() {
  const w = $('#welcome'); const k = await newIdentity(); const keys = await loadIdentityKeys(k);
  const digits = rand5(); let touched = false;
  const nameIn = h('input', { class: 'inp', placeholder: 'Display name', maxlength: 40, style: 'text-align:center;font-size:17px' });
  const idIn = idInput('user' + digits); idIn.style.cssText = 'text-align:center;font-size:17px';
  const btn = h('button', { class: 'btn primary block', style: 'margin-top:14px' }, 'Continue');
  const lbl = t => h('label', { style: 'display:block;text-align:left;font-size:12.5px;font-weight:650;color:var(--dim);margin:14px 0 6px' }, t);
  nameIn.addEventListener('input', () => { if (!touched) idIn.value = defaultHandle(nameIn.value, digits); });
  idIn.addEventListener('input', () => { touched = true; });
  const go = async () => {
    const name = nameIn.value.trim().slice(0, 40); if (!name) { nameIn.focus(); return; }
    const handle = idIn.value.trim().toLowerCase(); const bad = handleProblem(handle); if (bad) { toast(bad, 'error'); idIn.focus(); return; }
    btn.disabled = true; btn.textContent = 'Checking…';
    const r = await probeHandle(handle);
    if (r === 'taken') { toast('“' + handle + '” is already taken — try another', 'error'); btn.disabled = false; btn.textContent = 'Continue'; idIn.focus(); idIn.select(); return; }
    if (r === 'unknown') { toast('Can’t reach the server. Check your internet connection and try again.', 'error'); btn.disabled = false; btn.textContent = 'Continue'; return; }
    await persistIdentity({ d: k.d, x: k.x, y: k.y, name, handle }); await beginSession(keys, name, handle);
  };
  nameIn.addEventListener('keydown', e => { if (e.key === 'Enter') idIn.focus(); });
  idIn.addEventListener('keydown', e => { if (e.key === 'Enter') go(); });
  btn.addEventListener('click', go);
  w.replaceChildren(h('div', { class: 'wcard' }, h('div', { class: 'logo' }, icon('shield', 44)), h('h1', {}, 'Create your ID'),
    h('p', { class: 'tagline', style: 'margin-bottom:6px' }, 'Your ID is how friends find you. Keep the suggestion or type your own — you can change it later in Settings.'),
    lbl('Display name'), nameIn,
    lbl('Your ID'), idIn, h('div', { class: 'faint', style: 'text-align:left;font-size:12.5px;margin-top:6px' }, '3–12 characters: letters, numbers and _  (e.g. user1, user5_5)'),
    btn, h('button', { class: 'btn block', onclick: showWelcome }, 'Back')));
  setTimeout(() => nameIn.focus(), 60);
}
function restoreStep() {
  const w = $('#welcome'); const ta = h('textarea', { class: 'inp mono', rows: 4, placeholder: 'HL1-…', spellcheck: 'false' });
  const nm = h('input', { class: 'inp', placeholder: 'Display name', maxlength: 40 });
  const idIn = idInput(''); idIn.placeholder = 'Your ID (e.g. user54668)';
  ta.addEventListener('input', () => { // a recovery key made by this version remembers the ID
    try { const t = ta.value.trim(); if (t.startsWith('HL1-')) { const kk = JSON.parse(td.decode(unb64u(t.slice(4)))); if (isHandle(kk.h) && !idIn.value) idIn.value = kk.h; } } catch {}
  });
  const go = async () => {
    let k, keys;
    try { const t = ta.value.trim(); if (!t.startsWith('HL1-')) throw 0; k = JSON.parse(td.decode(unb64u(t.slice(4)))); keys = await loadIdentityKeys(k); }
    catch { toast('That recovery key is not valid', 'error'); return; }
    const name = nm.value.trim().slice(0, 40) || 'Me';
    const handle = (idIn.value.trim().toLowerCase() || (isHandle(k.h) ? k.h : defaultHandle(name)));
    const bad = handleProblem(handle); if (bad) { toast(bad, 'error'); idIn.focus(); return; }
    await persistIdentity({ d: k.d, x: k.x, y: k.y, name, handle }); await beginSession(keys, name, handle);
  };
  w.replaceChildren(h('div', { class: 'wcard' }, h('div', { class: 'logo' }, icon('key', 44)), h('h1', {}, 'Existing account'), h('p', { class: 'tagline' }, 'Paste your recovery key to sign in to your existing account.'),
    ta, h('div', { style: 'height:10px' }), nm, h('div', { style: 'height:10px' }), idIn,
    h('div', { class: 'faint', style: 'text-align:left;font-size:12.5px;margin-top:6px' }, 'If your other device is still online it simply connects as a second device.'),
    h('button', { class: 'btn primary block', onclick: go, style: 'margin-top:14px' }, 'Sign in'), h('button', { class: 'btn block', onclick: showWelcome }, 'Back')));
}
async function beginSession(keys, name, handle) {
  let av = ''; try { av = localStorage.getItem('hl.avatar') || ''; } catch {}
  S.me = { id: handle, priv: keys.priv, signer: keys.signer, pubRaw: keys.pubRaw, fp: await fpOf(keys.pubRaw), name, avatar: validAvatar(av) ? av : '' };
  $('#welcome').hidden = true; $('#app').hidden = false;
  (await DB.all('friends')).forEach(f => S.friends.set(f.id, f));
  buildChatPane(); buildPanel(); refreshRail(); L.stop = false; L.backoff = 500; startLink(); restoreUI();
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
  if (S.pendingAdd) { const p = S.pendingAdd; S.pendingAdd = null; setTimeout(() => openAddFriend(p), 300); }
  renderTopbar(); // the Android download bar only ever shows once someone is actually signed in
}

(function checkNewBuild() { setTimeout(async function () {
  try {
    if (!/^https?:$/.test(location.protocol)) return;

    const m = /name="build" content="([^"]+)"/.exec(t);
    if (m && m[1] !== BUILD && !sessionStorage.getItem('hl.upd.' + m[1])) { sessionStorage.setItem('hl.upd.' + m[1], '1'); location.replace(location.pathname + '?v=' + encodeURIComponent(m[1])); }
  } catch {}
}, 4000); })();
try { if (/[?&]v=/.test(location.search)) history.replaceState({}, '', location.pathname + location.hash); } catch {}
if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
if (window.__HC_TEST) Object.assign(window.__HC_TEST, { S, DB, isOnline, addFriend, openChat, applyNewId, deleteEveryone, openAddFriend, saveFriend, XF, paintMedia, checkApk, startCall, acceptCall, endCall, enableLock, disableLock, lockOn, wipeNow, ICE_RELAY_ONLY: () => ICE_RELAY_ONLY, loadIce, buildPanel, refreshRail });   // test hook, inactive normally
(async function boot() {
  loadSettings(); S.settings.themeLight = S.settings.theme === 'light';
  if (!window.crypto || !crypto.subtle) { document.body.innerHTML = '<p style="padding:24px;color:#fff">This app needs a secure context (HTTPS or localhost).</p>'; return; }
  const hm = /#add=([A-Za-z0-9_]+)(?:&n=([^&]*))?(?:&k=([0-9a-f]{16}))?/.exec(location.hash);
  if (hm) { let nm = ''; try { nm = decodeURIComponent(hm[2] || ''); } catch {} S.pendingAdd = { id: hm[1].toLowerCase(), name: nm, fp: hm[3] || '' }; try { history.replaceState({}, '', location.pathname); } catch {} }
  try { await DB.open(); } catch { document.body.innerHTML = '<p style="padding:24px;color:#fff">Storage is unavailable (private mode?). Please use a normal browser window.</p>'; return; }
  const raw = localStorage.getItem('hl.key');
  const gotoLocked = lockOn();
  const proceedWith = async (k) => {
      const keys = await loadIdentityKeys(k);
      let handle = k.handle, migrated = false;
      if (!isHandle(handle)) { // account made before short IDs existed: give it one automatically

      }

        h('p', { class: 'dim' }, 'Long IDs are gone. Your new ID is below — it’s how friends find you. You can change it any time in Settings. Friends you added with the old long ID will need to add you again with this one.'),
        h('div', { class: 'idbox mono', style: 'font-size:18px' }, handle),
        h('div', { class: 'btnrow' }, h('button', { class: 'btn ghost', onclick: () => { close(); changeIdSheet(); } }, 'Change it'), h('button', { class: 'btn primary', onclick: close }, 'Got it')))), 600);
      return;
  };
  if (gotoLocked) {

      catch (e) { if (e instanceof DOMException || (e && /decrypt/i.test(e.message || ''))) bad(); else { console.warn('identity', e); bad(); } }
    });

    return;
  }
